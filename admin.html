<body>
    <h1>Admin Panel</h1>
    <div id="content"></div>
      <script>
        // Read cookies (simple version)
        const cookies = document.cookie;
        const isAdmin = cookies.includes("role=admin");
    
        if (isAdmin) {
          document.getElementById("content").innerHTML =
            "<p>Welcome, admin.</p>";
        } else {
          document.getElementById("content").innerHTML =
            "<p>You are not authorized to view this page.</p>";
        }
      </script>
</body>
